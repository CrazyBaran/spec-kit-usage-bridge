# Development tooling only — the extension itself is not a Python distribution.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/python", "tests"]
addopts = "-ra"
markers = [
    "contract: tests against the vendored token-usage module",
    "integration: needs uv, git and network (Spec Kit v1.0.12)",
    "perf: performance budgets",
]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["scripts/python", "tests"]
extend-exclude = ["scripts/python/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints must parse and report on any Python 3: keep the version guard and %-formatting.
"scripts/python/capture.py" = ["UP"]
"scripts/python/report.py" = ["UP"]
"scripts/python/check.py" = ["UP"]
"scripts/python/checkpoint.py" = ["UP"]
