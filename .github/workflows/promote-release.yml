name: Promote release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version X.Y.Z
        required: true
        type: string
      candidate_tag:
        description: Published prerelease tag to promote
        required: true
        type: string
      source_sha:
        description: Exact candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  ci:
    if: github.repository == 'CrazyBaran/spec-kit-usage-bridge' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  promote:
    needs: ci
    runs-on: ubuntu-latest
    environment: release-publish
    timeout-minutes: 20
    concurrency:
      group: usage-bridge-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Assemble promotion context without publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python tools/release_cli.py promotion-context --version "$RELEASE_VERSION" --candidate-tag "$CANDIDATE_TAG" --source-sha "$SOURCE_SHA" --output promotion-context.json
      - name: Publish the verified candidate bytes through the release CLI
        run: python tools/release_cli.py publish --evidence release-evidence.json --assets-dir release-assets --output publish.json
