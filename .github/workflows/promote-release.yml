name: Promote release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z
        required: true
        type: string
      source_sha:
        description: Exact release branch commit
        required: true
        type: string
      candidate_tag:
        description: Published prerelease at the current release branch tip
        required: true
        type: string
      override_reason:
        description: Reason for an explicitly approved quality waiver
        type: string
        default: ''
      waived_checks:
        description: JSON array of exact failed quality check names
        type: string
        default: '[]'
concurrency:
  group: usage-bridge-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
jobs:
  pipeline:
    if: github.repository == 'CrazyBaran/spec-kit-usage-bridge' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-pipeline.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      candidate_tag: ${{ inputs.candidate_tag }}
      override_reason: ${{ inputs.override_reason }}
      waived_checks: ${{ inputs.waived_checks }}
