name: Promote release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version X.Y.Z
        required: true
        type: string
      candidate_tag:
        description: Published prerelease tag to promote
        required: true
        type: string
      source_sha:
        description: Exact candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  ci:
    if: github.repository == 'CrazyBaran/spec-kit-usage-bridge' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  promote:
    needs: ci
    runs-on: ubuntu-latest
    environment: release-publish
    timeout-minutes: 20
    concurrency:
      group: usage-bridge-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify the candidate before any stable publication
        run: python tools/release_cli.py prepare --version "${{ inputs.version }}" --main-sha "${{ inputs.source_sha }}" --output promotion-context.json --dry-run
