name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z
        required: true
        type: string
      main_sha:
        description: Fresh main SHA the branch is cut from
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'CrazyBaran/spec-kit-usage-bridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-publish
    timeout-minutes: 10
    concurrency:
      group: usage-bridge-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.main_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/release_cli.py prepare --version "${{ inputs.version }}" --main-sha "${{ inputs.main_sha }}" --output release-prepare.json
