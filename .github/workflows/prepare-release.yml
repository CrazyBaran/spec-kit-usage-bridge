name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z
        required: true
        type: string
      main_sha:
        description: Fresh main SHA the branch is cut from
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'CrazyBaran/spec-kit-usage-bridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-publish
    timeout-minutes: 10
    concurrency:
      group: usage-bridge-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.main_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Prepare the release branch
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: python tools/release_cli.py prepare --version "$RELEASE_VERSION" --main-sha "$MAIN_SHA" --output release-prepare.json
