name: Verify release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to download and verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.complete.outputs.digest }}
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  download:
    if: github.repository == 'CrazyBaran/spec-kit-usage-bridge' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/heads/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Download and cryptographically verify published assets
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/release_cli.py verify --tag "$RELEASE_TAG" --download-dir downloaded --output downloaded/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-downloaded-${{ github.run_attempt }}
          path: downloaded/
          if-no-files-found: error
          retention-days: 14
  verify-install:
    needs: download
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        host: [minimum, current]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/heads/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-downloaded-${{ github.run_attempt }}
          path: downloaded
      - name: Exercise the published archive without publication credentials
        env:
          UB_REQUIRE_INTEGRATION: '1'
          UB_SPEC_KIT_REF: ${{ matrix.host == 'minimum' && 'v1.0.12' || 'v1.1.0' }}
          UB_RELEASE_ARCHIVE: ${{ github.workspace }}/downloaded/usage-bridge-v${{ needs.download.outputs.version }}.zip
        run: python -m pytest tests/integration/test_release_install.py -q
  complete:
    needs: [download, verify-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.complete.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/heads/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-downloaded-${{ github.run_attempt }}
          path: downloaded
      - name: Bind successful installation results to the downloaded digest
        id: complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_cli.py complete-verification --verification downloaded/verification.json --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output verified/verification.json
      - run: cp downloaded/extension.json verified/extension.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.run_attempt }}
          path: verified/
          if-no-files-found: error
          retention-days: 14
