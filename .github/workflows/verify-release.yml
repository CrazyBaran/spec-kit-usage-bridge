name: Verify release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Record the tag under verification
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c "import os, pathlib; pathlib.Path('verify-tag.txt').write_text(os.environ['RELEASE_TAG'] + '\n')"
