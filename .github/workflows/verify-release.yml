name: Verify release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Record the tag under verification
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c "import os, pathlib; pathlib.Path('verify-tag.txt').write_text(os.environ['RELEASE_TAG'] + '\n')"
